[package]
name = "pccare-master-pro"
version = "2.0.0-alpha.1"
description = "Thien Phat Tech Toolkit Pro (Tauri)"
authors = ["Thien Phat Tech"]
license = "MIT"
repository = "https://github.com/thangdggr0004-cpu/PCCarePro"
edition = "2021"

rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
open = "5"
tokio = { version = "1", features = ["process", "macros", "sync", "time", "rt", "rt-multi-thread"] }

[profile.release]
strip = true
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

